<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Mir'ah 2.0 MVP: scanner, score out of 100, smart assistant. Palette: Amman night, Egyptian lapis, Petra rose, desert gold, Ajloun olive, Nile sand */
:root{
  --night:#14203A; --lapis:#2557A7; --rose:#E06C5A; --rose-ink:#B4473A; --gold:#F2B33D; --olive:#4F8A5B;
  --bg:#FFF7EC; --surface:#FFFFFF; --mist:#E9EEF6; --fg:#14203A; --muted:#5A6478; --line:#E6DFD3;
  --accent:#2557A7; --on-accent:#FFFFFF; --pulse:#14203A; --me:#14203A;
  --band-low:#F6D2CB; --band-mid:#FBE6BC; --band-high:#D3E6D6; --band-low-ink:#9A3527; --band-mid-ink:#7A5600; --band-high-ink:#2F6B3C;
  --display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif; --body:'IBM Plex Sans Arabic','Readex Pro',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1626;--surface:#16223A;--mist:#1E2C47;--fg:#F3EEE6;--muted:#A9B3C6;--line:#2A3955;--accent:#7EA6F2;--on-accent:#0E1626;--pulse:#FFF7EC;--me:#2557A7;--rose-ink:#F09A8C;--band-low:#4A2A2A;--band-mid:#4A3B1C;--band-high:#1F3A28;--band-low-ink:#F6B3A8;--band-mid-ink:#F7D488;--band-high-ink:#A6D9B1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1626;--surface:#16223A;--mist:#1E2C47;--fg:#F3EEE6;--muted:#A9B3C6;--line:#2A3955;--accent:#7EA6F2;--on-accent:#0E1626;--pulse:#FFF7EC;--me:#2557A7;--rose-ink:#F09A8C;--band-low:#4A2A2A;--band-mid:#4A3B1C;--band-high:#1F3A28;--band-low-ink:#F6B3A8;--band-mid-ink:#F7D488;--band-high-ink:#A6D9B1;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.7}
.app{max-width:1200px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{height:42px;width:42px;color:var(--pulse)}
.brand b{font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
.brand small{display:block;font-family:var(--display);font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:600}
.pill{font-size:12px;font-family:var(--display);font-weight:600;padding:4px 10px;border-radius:999px;background:var(--mist);color:var(--accent)}
.lang{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:19px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#14203A;aspect-ratio:3/4;max-height:440px;max-width:100%;display:grid;place-items:center;cursor:crosshair}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .roi{position:absolute;border:2px solid var(--gold);border-radius:12px;box-shadow:0 0 0 999px rgba(20,32,58,.28);pointer-events:none}
.stage .roi span{position:absolute;top:-24px;inset-inline-end:0;font-size:11px;color:#FFF7EC;background:rgba(20,32,58,.75);padding:1px 8px;border-radius:6px;white-space:nowrap}
.stage .empty{color:#C9D3E6;text-align:center;padding:24px;display:flex;flex-direction:column;gap:12px;align-items:center;font-size:14px}
.stage .empty svg{width:84px;height:84px;color:#FFF7EC}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
button,.btn{font-family:var(--display);font-weight:600;font-size:14px;border-radius:12px;border:1px solid transparent;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:inherit}
.primary{background:var(--accent);color:var(--on-accent)}
.primary:hover{filter:brightness(1.07)}
.gold{background:var(--gold);color:#14203A}
.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.ghost:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,.btn:focus-within,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.progress{height:8px;border-radius:8px;background:var(--mist);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lapis),var(--rose));transition:width .2s}
.status{font-size:13px;color:var(--muted);min-height:22px}
details summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:14px}
details p{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
/* score */
.scorebox{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:center}
.ring{position:relative;width:200px;height:200px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.ring .num b{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ring .num span{font-size:13px;color:var(--muted)}
.band{display:inline-block;font-family:var(--display);font-weight:600;font-size:14px;padding:4px 12px;border-radius:999px}
.band.low{background:var(--band-low);color:var(--band-low-ink)} .band.mid{background:var(--band-mid);color:var(--band-mid-ink)} .band.high{background:var(--band-high);color:var(--band-high-ink)}
.band.none{background:var(--mist);color:var(--muted)}
.parts{display:flex;flex-direction:column;gap:7px}
.part{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:8px;align-items:center;font-size:13px}
.part .bar{height:7px;border-radius:7px;background:var(--mist);overflow:hidden}
.part .bar i{display:block;height:100%;background:var(--accent);border-radius:7px}
.part em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);text-align:end}
.conf{font-size:12.5px;font-family:var(--display);font-weight:600}
.sample-tag{font-size:12px;color:var(--rose-ink);font-family:var(--display);font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.m{border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:0;min-width:0}
.m .k{font-size:12px;color:var(--muted)}
.m .v{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.3;font-variant-numeric:tabular-nums}
.m .u{font-size:11.5px;color:var(--muted)}
.sig{width:100%;height:80px;display:block;border-radius:12px;background:var(--bg)}
.ctx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
select,input[type=text]{font-family:var(--body);font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.coach{background:var(--mist);border-radius:16px;padding:16px;min-height:90px}
.coach h4{font-family:var(--display);font-size:15px;margin:10px 0 2px;color:var(--accent)}
.coach h4:first-child{margin-top:0}
.coach p{margin:0 0 6px}
/* assistant */
.assist{border:2px solid var(--gold)}
.assist .head{display:flex;gap:12px;align-items:center}
.spark{width:44px;height:44px;border-radius:14px;background:var(--gold);display:grid;place-items:center;flex:none}
.spark svg{width:24px;height:24px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{background:var(--bg);border:1px solid var(--line);font-family:var(--body);font-weight:500;font-size:13px;padding:6px 12px;border-radius:999px}
.chips button:hover{border-color:var(--gold)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:13px;padding:6px 12px;border-radius:10px}
.tabs button[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#14203A}
.follow{display:flex;gap:6px;flex-wrap:wrap;align-self:flex-end;max-width:88%}
.follow button{background:var(--bg);border:1px dashed var(--gold);font-family:var(--body);font-weight:500;font-size:12.5px;padding:5px 10px;border-radius:999px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto}
.bubble{padding:10px 14px;border-radius:16px;max-width:88%;white-space:pre-wrap}
.bubble.me{background:var(--me);color:#FFF7EC;align-self:flex-start;border-end-start-radius:4px}
.bubble.ai{background:var(--mist);align-self:flex-end;border-end-end-radius:4px}
.bubble small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.plan{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface);min-width:0}
.plan b{font-family:var(--display);display:block;font-size:14px}
.plan .p{font-family:var(--display);font-size:22px;font-weight:700;color:var(--accent)}
.plan .p small{font-size:12px;color:var(--muted);font-weight:500}
.plan span{font-size:12.5px;color:var(--muted)}
.plan.hl{border:2px solid var(--rose)}
.note{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin:0}
@media (max-width:960px){.grid{grid-template-columns:1fr}.plans{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.scorebox{grid-template-columns:1fr;justify-items:center}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.ctx{grid-template-columns:1fr}.part{grid-template-columns:minmax(0,1fr) 70px 40px}}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>

<div class="app">
  <header>
    <a class="brand" href="index.html" style="text-decoration:none;color:inherit">
      <svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="mgH" x1="0.9" y1="0" x2="0.1" y2="0.9"><stop offset="0" stop-color="#2557A7"/><stop offset="1" stop-color="#E06C5A"/></linearGradient></defs><circle cx="60" cy="60" r="46" fill="none" stroke="#2557A7" stroke-opacity=".18" stroke-width="10"/><circle cx="60" cy="60" r="46" fill="none" stroke="url(#mgH)" stroke-width="10" stroke-linecap="round" stroke-dasharray="236 289" transform="rotate(-90 60 60)"/><path d="M32 63 H46 L52 49 L60 78 L68 45 L74 63 H88" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 22 Q23 32 33 34 Q23 36 21 46 Q19 36 9 34 Q19 32 21 22Z" fill="#F2B33D"/></svg>
      <div><b>مرآة</b><small>MIR'AH</small></div>
      <span class="pill" data-t="pill"></span>
    </a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="jo">أردني</button>
      <button type="button" data-lang="eg">مصري</button>
      <button type="button" data-lang="en">English</button>

  </header>

  <div class="grid">
    <div class="card">
      <div class="row between"><h2 data-t="scanTitle"></h2><span class="muted small" data-t="privacy"></span></div>

          <span data-t="emptyText"></span>
        </div>
        <video id="vid" muted playsinline hidden></video>
        <div class="roi" id="roi" hidden><span data-t="roi"></span></div>
      </div>
      <div class="row">
        <label class="btn primary" for="file"><span data-t="upload"></span><input type="file" id="file" accept="video/*"></label>
        <button class="ghost" id="demoBtn" type="button" data-t="demo"></button>
        <button class="ghost" id="stopBtn" type="button" hidden data-t="stop"></button>
      </div>
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
      <div class="status" id="status" role="status"></div>
      <div class="ctx">
        <label class="f"><span data-t="qSleep"></span><select id="sleep"></select></label>
        <label class="f"><span data-t="qMood"></span><select id="mood"></select></label>
      </div>
      <details><summary data-t="howTitle"></summary><p data-t="howText"></p></details>
    </div>

    <div class="card">
      <div class="row between"><h2 data-t="todayTitle"></h2><span class="sample-tag" id="sampleTag" data-t="sampleTag"></span></div>
      <div class="scorebox">
        <div class="ring" aria-live="polite">
          <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="86" fill="none" stroke="var(--mist)" stroke-width="16"/><circle id="ringArc" cx="100" cy="100" r="86" fill="none" stroke="var(--olive)" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 541"/></svg>
          <div class="num"><b id="scoreNum">--</b><span data-t="of100"></span></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
          <div class="row"><span class="band none" id="band"></span><span class="conf muted" id="conf"></span></div>
          <div class="parts" id="parts"></div>
        </div>
      </div>
      <div class="metrics">
        <div class="m"><span class="k" data-t="mHR"></span><span class="v" id="mHR">--</span><span class="u" data-t="uHR"></span></div>
        <div class="m"><span class="k" data-t="mHRV"></span><span class="v" id="mHRV">--</span><span class="u">RMSSD · ms</span></div>
        <div class="m"><span class="k" data-t="mResp"></span><span class="v" id="mResp">--</span><span class="u" data-t="uResp"></span></div>
        <div class="m"><span class="k" data-t="mStress"></span><span class="v" id="mStress">--</span><span class="u" data-t="of100"></span></div>
      </div>
      <canvas class="sig" id="sig" aria-hidden="true"></canvas>
      <div class="row between"><h2 data-t="coachTitle"></h2><span class="muted small" id="coachSrc"></span></div>
      <div class="row"><button class="primary" id="coachBtn" type="button" data-t="coachBtn"></button><button class="ghost" id="coachStop" type="button" hidden data-t="stop"></button></div>
      <div class="coach" id="coach" aria-live="polite"></div>
    </div>
  </div>

  <div class="card assist">
    <div class="head">
      <div class="spark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 Q13 10 22 12 Q13 14 12 22 Q11 14 2 12 Q11 10 12 2Z" fill="#14203A"/></svg></div>
      <div style="min-width:0"><h2 data-t="assistTitle"></h2><div class="muted small" data-t="assistSub"></div></div>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="chips" id="chips"></div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <form class="row" id="askForm">
      <input type="text" id="ask" style="flex:1;min-width:200px" autocomplete="off">
      <button class="gold" type="submit" id="askBtn" data-t="send"></button>
    </form>
  </div>

  <div class="plans" id="plans"></div>
  <p class="note" data-t="note"></p>
</div>

<script>
const $ = id => document.getElementById(id);
const FS = 30, MAX_SEC = 30;
let roi = {cx:.5, cy:.27, w:.30, h:.16};
let current = null, isSampleRes = true, stopFlag = false, sampleFn = null, finishScan = null, coachCtl = null, lastReportSrc = '';
let history = []; let lastStatus = ['boot'];
function setStatus(key, ...args){ lastStatus=[key,...args]; const v=T[lang].st[key]; $('status').textContent = typeof v==='function' ? v(...args) : v; } // {q,a} pairs for the assistant
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
let lang = store.get('mirah.lang') || 'jo';

// ---------- copy: Jordanian, Egyptian, English ----------
const T = {
 jo:{ dir:'rtl', html:'ar-JO', pill:'النسخة التجريبية 2.0', scanTitle:'فحص 30 ثانية', privacy:'الفيديو بنحلّل على جهازك وما بينرفع',
  emptyText:'صوّر وجهك بالكاميرا الأمامية 20 لـ 30 ثانية بضو طبيعي وبدون حركة، وبعدين ارفع المقطع هون.', roi:'منطقة القياس · اكبس لتحرّكها',
  upload:'ارفع سيلفي فيديو', demo:'جرّب بعيّنة جاهزة', stop:'وقّف', qSleep:'كم ساعة نمت مبارح؟', qMood:'كيف حاسس حالك هلّق؟',
  sleepOpts:['أقل من 5','5 لـ 6','7 لـ 8','أكثر من 8'], moodOpts:['نشيط','عادي','تعبان','متوتر'],
  howTitle:'كيف بنقيس؟', howText:'مع كل نبضة بيندفع الدم بالشعيرات تحت الجلد وبيتغيّر لونه شوي كثير. بناخد متوسط ألوان الجبهة بكل إطار، بنطلّع الإشارة بطريقة CHROM، وبنحسب النبض وتباين النبض والتنفس. بعدين بنجمعهم مع نومك وشعورك بنتيجة وحدة من 100.',
  todayTitle:'نتيجة مرآة اليوم', sampleTag:'مثال من عيّنة تجريبية', of100:'من 100',
  bands:{low:'محتاج انتباه', mid:'منيح', high:'ممتاز', none:'ما في نتيجة'}, conf:{good:'الثقة: عالية', mid:'الثقة: متوسطة', bad:'الإشارة ضعيفة، ما بنعطي رقم'},
  parts:['راحة القلب','التوازن والتوتر','التنفس','النوم والشعور','الانتظام'],
  mHR:'النبض', uHR:'نبضة/دقيقة', mHRV:'تباين النبض', mResp:'التنفس', uResp:'نَفَس/دقيقة', mStress:'مؤشر التوتر',
  coachTitle:'تقرير اليوم', coachBtn:'اكتبلي تقريري', coachThinking:'المساعد عم يقرأ نتيجتك...',
  srcAuto:'تقرير تلقائي مختصر', srcAI:'كتبه المساعد الذكي من قراءاتك', srcOff:'تقرير تلقائي مختصر (التقرير الذكي الكامل بالتطبيق)', srcBusy:'تقرير تلقائي (طلبات كثير، جرّب بعد شوي)', srcErr:'تقرير تلقائي (انقطع الاتصال، جرّب كمان مرة)',

// ---------- app knowledge for the assistant ----------
const KB = `معلومات عن تطبيق مرآة (Mir'ah):
- رفيق صحي يومي على الجوال. يطلق حالياً في الأردن ومصر، بالعربية (لهجة أردنية أو مصرية) والإنجليزية.
- فحص 30 ثانية بسيلفي فيديو يقرأ من الوجه بتقنية rPPG: نبض الراحة، تباين النبض HRV (RMSSD)، معدل التنفس، ومؤشر التوتر.
- «نتيجة مرآة» من 100 = راحة القلب 25 + التوازن والتوتر 30 + التنفس 15 + النوم والشعور (سؤالان) 20 + الانتظام آخر 7 أيام 10. 0-49 محتاج انتباه، 50-74 منيح/كويس، 75-100 ممتاز.
- مع كل نتيجة درجة ثقة (عالية/متوسطة)، وإذا كانت الإشارة ضعيفة لا تظهر نتيجة ويُطلب إعادة الفحص. نصائح لفحص أفضل: ضوء طبيعي أمام الوجه، الجوال ثابت، عدم الكلام، إبعاد الشعر عن الجبهة.
- الخصوصية: الفيديو يُحلَّل على جهاز المستخدم ولا يُرفع أبداً، وتُحفظ الأرقام فقط مشفّرة، وفق قانون حماية البيانات الأردني رقم 24 لسنة 2023 والمصري رقم 151 لسنة 2020.
- الباقات (أسعار رمزية بالدولار وتدفع بالعملة المحلية): مجاني 0$ (فحص يومي + النتيجة + 5 أسئلة للمساعد يومياً)؛ بلس 1.99$ شهرياً أو 14.99$ سنوياً (فحص ومساعد بلا حدود، اتجاهات شهرية، تقرير للطبيب)؛ العيلة 3.99$ شهرياً (حتى 5 أفراد، متابعة الأهل بموافقتهم من أي بلد)؛ للأعمال 1$ للموظف شهرياً (لوحة عافية مجمّعة لا تكشف أحداً). الدفع: CliQ و eFAWATEERcom في الأردن، فوري والمحافظ الإلكترونية في مصر.
- الميزات: النتيجة اليومية، تقرير اليوم، المساعد الذكي، متابعة العيلة، تقرير أسبوعي للطبيب يُشارك بضغطة، تحدي 7 أيام.
- مرآة منتج عافية وليس جهازاً طبياً، ولا يشخّص. الطوارئ: 911 في الأردن، 123 للإسعاف في مصر.`;
const RULES = `أنت «المساعد الذكي» داخل تطبيق مرآة. مهمتك: ألا يتوه أي مستخدم. تجيب عن أي سؤال عن التطبيق (الميزات، الأسعار، الخصوصية، طريقة الفحص، معنى النتيجة) أو عن العافية والصحة اليومية (النوم، التوتر، التنفس، النشاط، الماء، الصيام).
قواعد ثابتة: لا تشخّص أي مرض ولا تقترح أدوية أو جرعات. قل «مؤشر» لا «تشخيص». عند أعراض خطيرة (ألم صدر، ضيق نفس، إغماء، أفكار إيذاء النفس) وجّه فوراً للطوارئ برقم البلد. إذا كانت القراءة غير معتادة جداً (نبض راحة فوق 110 أو تحت 45) انصح بلطف بمراجعة طبيب. لا تخترع أرقاماً أو ميزات أو أسعاراً غير المذكورة. إذا كان السؤال خارج الصحة والتطبيق، أجب بجملة لطيفة وأعد الحديث لما تقدر تساعد فيه. كن قصيراً وواضحاً ودافئاً.`;

 {k:/(الم|وجع|ضغط)\s*(ب|في)?\s*(صدري|الصدر|صدر)|ضيق (نفس|تنفس|بالنفس)|مش قادر اتنفس|ما بقدر اتنفس|اغما|بغمي|دايخ كتير|جلطه|سكته|انتحار|اذي نفسي|اموت حالي|chest pain|can'?t breathe|faint|stroke|heart attack|suicid|kill myself|hurt myself/, jo:'هاد ممكن يكون طارئ. اتصل بالطوارئ على 911 هلّق، أو خلّي حدا جنبك يوصلك لأقرب طوارئ. مرآة مش بديل عن الإسعاف.', eg:'ده ممكن يكون طارئ. اتصل بالإسعاف على 123 دلوقتي، أو خلّي حد جنبك يوديك أقرب طوارئ. مرآة مش بديل عن الإسعاف.', en:'This could be an emergency. Call emergency services now (911 in Jordan, 123 in Egypt) or have someone take you to the nearest ER. Mir\'ah is not a substitute for emergency care.'},
 {k:/^(مرحبا|مرحبتين|هلا|اهلين|اهلا|السلام|سلام|هاي|صباح|مساء|يا هلا|hi\b|hello|hey|good (morning|evening))/, jo:'أهلين فيك! أنا المساعد الذكي تبع مرآة. اسألني عن نتيجتك، الأسعار، الخصوصية، النوم، التوتر، أو أي إشي بالتطبيق.', eg:'أهلاً بيك! أنا المساعد الذكي بتاع مرآة. اسألني عن نتيجتك، الأسعار، الخصوصية، النوم، التوتر، أو أي حاجة في التطبيق.', en:'Hi there! I\'m Mir\'ah\'s Smart Assistant. Ask me about your score, prices, privacy, sleep, stress, or anything in the app.'},
 {k:/(شكرا|يسلمو|تسلم|يعطيك العافيه|متشكر|ميرسي|thank|thx)/, jo:'العفو! إذا بدك إشي ثاني أنا هون.', eg:'العفو! لو محتاج أي حاجة تانية أنا موجود.', en:'You\'re welcome! I\'m here if you need anything else.'},
 {k:/(مين انت|انت مين|شو انت|ايش انت|انت روبوت|who are you|what are you|are you (a )?(bot|human))/, jo:'أنا المساعد الذكي تبع مرآة. بساعدك تفهم نتيجتك اليومية وبجاوبك عن التطبيق والعافية بلهجتك. ما بشخّص، بس بوجّهك.', eg:'أنا المساعد الذكي بتاع مرآة. بساعدك تفهم نتيجتك اليومية وبرد عليك عن التطبيق والصحة بلهجتك. مش بشخّص، بس بوجّهك.', en:'I\'m Mir\'ah\'s Smart Assistant. I help you understand your daily score and answer questions about the app and everyday wellbeing. I don\'t diagnose, I guide.'},
 {k:/(تمرين تنفس|تمارين تنفس|كيف اهدي|كيف اهدا|بدي اهدا|اهدي حالي|اريح اعصابي|اهدي نفسي|اهدا نفسي|breathing exercise|calm down|how (do|can) i relax)/, jo:'جرّب تنفّس 4-6: شهيق من الأنف 4 ثواني، وزفير بطيء من الفم 6 ثواني، لمدة دقيقتين. الزفير الأطول بيهدّي الجسم. بعدها أعد الفحص وشوف الفرق بمؤشر التوتر.', eg:'جرّب تنفّس 4-6: شهيق من مناخيرك 4 ثواني، وزفير بالراحة من بقك 6 ثواني، لمدة دقيقتين. الزفير الأطول بيهدّي الجسم. وبعدها اعمل الفحص تاني وشوف الفرق في مؤشر التوتر.', en:'Try 4-6 breathing: in through your nose for 4 seconds, slowly out through your mouth for 6, for two minutes. A longer exhale calms the body. Then scan again and watch your stress index.'},
 {k:/(قلق|خايف|خوف|ضغط (الشغل|شغل|الدراسه|نفسي)|مضغوط|هلع|بانيك|نوبه|متوتر كتير|anxiety|anxious|panic)/, jo:'طبيعي تحس هيك أحياناً. جرّب دقيقتين تنفّس بطيء (شهيق 4، زفير 6)، واشرب مي، وامشِ شوي. إذا القلق صار يأثر على يومك أو نومك، الحكي مع مختص بيفرق كثير.', eg:'طبيعي تحس كده ساعات. جرّب دقيقتين تنفّس بالراحة (شهيق 4، زفير 6)، واشرب مية، واتمشّى شوية. لو القلق بقى مأثر على يومك أو نومك، الكلام مع مختص بيفرق جداً.', en:'It\'s normal to feel this sometimes. Try two minutes of slow breathing (in 4, out 6), drink water and take a short walk. If anxiety starts affecting your day or sleep, talking to a professional really helps.'},
 {k:/(مزاج|زعلان|حزين|مكتئب|اكتئاب|مضايق|طفشان|mood|sad|depress|down today)/, jo:'سلامتك. المزاج بيأثر على الجسم، وعشان هيك بنسألك عنه بكل فحص. نصيحة بسيطة: طلعة قصيرة بالشمس، وحكي مع حدا بتحبه. وإذا الحزن مطوّل، الحكي مع مختص خطوة قوية مش ضعف.', eg:'سلامتك. المزاج بيأثر على الجسم، وعشان كده بنسألك عنه في كل فحص. نصيحة بسيطة: خروجة قصيرة في الشمس، وكلام مع حد بتحبه. ولو الزعل طوّل، الكلام مع مختص خطوة قوية مش ضعف.', en:'Sorry you\'re feeling this way. Mood affects the body, which is why we ask about it every scan. A short walk in daylight and talking to someone you love can help. If sadness lingers, speaking to a professional is a strong step.'},
 {k:/(قهوه|كافيين|نسكافيه|اسبريسو|شاي|ريد بول|مشروب طاقه|coffee|caffeine|tea\b|energy drink)/, jo:'القهوة والشاي بيرفعوا النبض شوي وبيقللوا تباين النبض لكم ساعة. عشان قراءة عادلة، افحص قبل القهوة أو بعدها بساعتين، وخفّف الكافيين بعد العصر عشان نومك.', eg:'القهوة والشاي بيعلّوا النبض شوية وبيقللوا تباين النبض لكام ساعة. عشان قراءة مظبوطة، اعمل الفحص قبل القهوة أو بعدها بساعتين، وقلّل الكافيين بعد العصر عشان نومك.', en:'Coffee and tea raise heart rate a little and lower HRV for a few hours. For a fair reading, scan before your coffee or two hours after, and cut caffeine after mid-afternoon for better sleep.'},
 {k:/(دخان|تدخين|بدخن|سجاير|سجائر|اركيله|شيشه|فيب|smok|cigar|vape|shisha|hookah)/, jo:'التدخين والأرجيلة بيرفعوا نبض الراحة وبيقللوا تباين النبض، وبتشوف هاد بنتيجتك. حتى تخفيف بسيط بيبيّن تحسّن خلال أسابيع، ومرآة بتوريك الفرق يوم بيوم.', eg:'السجاير والشيشة بيعلّوا نبض الراحة وبيقللوا تباين النبض، وده بيبان في نتيجتك. حتى لو قلّلت شوية هتلاحظ تحسّن خلال أسابيع، ومرآة هتوريك الفرق يوم بيوم.', en:'Smoking and shisha raise resting heart rate and lower HRV, and it shows in your score. Even cutting down a little shows improvement within weeks, and Mir\'ah lets you see it day by day.'},
 {k:/(صيام|صايم|بصوم|رمضان|فطور|سحور|افطار|fasting|ramadan|suhoor|iftar)/, jo:'بالصيام النبض والنتيجة ممكن يتغيروا شوي، خصوصاً آخر النهار. أحسن وقت للفحص بعد السحور أو قبل الإفطار بنفس الوقت كل يوم، واشرب مي كفاية بين الإفطار والسحور.', eg:'في الصيام النبض والنتيجة ممكن يتغيروا شوية، خصوصاً آخر النهار. أحسن وقت للفحص بعد السحور أو قبل الفطار في نفس المعاد كل يوم، واشرب مية كفاية بين الفطار والسحور.', en:'While fasting, heart rate and score can shift a little, especially late in the day. Scan at the same time daily, after suhoor or before iftar, and drink enough water between iftar and suhoor.'},
 {k:/((^|\s)(مي|ميه|مايه|مياه)(\s|$|\?)|شرب ماء|عطش|جفاف|water|hydrat|dehydrat)/, jo:'قلة المي بترفع النبض وبتنزّل النتيجة. حاول تشرب 6 لـ 8 كاسات بالنهار، وأكثر بالصيف أو مع الرياضة.', eg:'قلة المية بتعلّي النبض وبتنزّل النتيجة. حاول تشرب من 6 لـ 8 كوبايات في اليوم، وأكتر في الصيف أو مع الرياضة.', en:'Dehydration raises heart rate and lowers your score. Aim for 6 to 8 glasses a day, more in summer or when you exercise.'},
 {k:/(رياضه|تمارين|تمرين|جيم|نادي|ركض|جري|مشي|بمشي|exercise|workout|gym|running|jog|walk)/, jo:'الرياضة المنتظمة أحسن إشي لنتيجتك على المدى البعيد. بس افحص قبل التمرين أو بعده بساعة على الأقل، لأنه مباشرة بعد الرياضة النبض بيكون عالي. 30 دقيقة مشي باليوم بداية ممتازة.', eg:'الرياضة بانتظام أحسن حاجة لنتيجتك على المدى الطويل. بس اعمل الفحص قبل التمرين أو بعده بساعة على الأقل، لأن بعد الرياضة على طول النبض بيبقى عالي. 30 دقيقة مشي في اليوم بداية ممتازة.', en:'Regular exercise is the best thing for your score long term. Scan before a workout or at least an hour after, since heart rate stays high right after. 30 minutes of walking a day is a great start.'},
 {k:/(ضغط الدم|ضغطي|الضغط عالي|الضغط واطي|blood pressure|hypertension)/, jo:'مرآة ما بتقيس ضغط الدم. بتقيس النبض وتباينه والتنفس. لقياس الضغط استعمل جهاز ضغط على الذراع، وإذا كان عالي بشكل متكرر راجع طبيب.', eg:'مرآة مش بتقيس ضغط الدم. بتقيس النبض وتباينه والتنفس. لقياس الضغط استخدم جهاز ضغط على الدراع، ولو كان عالي كتير راجع دكتور.', en:'Mir\'ah does not measure blood pressure. It measures heart rate, HRV and breathing. Use an upper-arm cuff for blood pressure, and see a doctor if it is often high.'},
 {k:/(سكري|السكر|سكر الدم|diabet|glucose|blood sugar)/, jo:'مرآة ما بتقيس السكر. لقياسه بتحتاج جهاز سكر. بس النوم والتوتر والنشاط اللي بنتابعهم إلهم أثر على السكر، فالعادات الحلوة بتفيد بالاثنين.', eg:'مرآة مش بتقيس السكر. لقياسه محتاج جهاز سكر. بس النوم والتوتر والنشاط اللي بنتابعهم ليهم تأثير على السكر، فالعادات الكويسة بتفيد في الاتنين.', en:'Mir\'ah does not measure blood sugar; you need a glucose meter for that. Sleep, stress and activity, which we track, do affect blood sugar, so good habits help both.'},
 {k:/(اكسجين|تشبع|oxygen|spo2|saturation)/, jo:'نسبة الأكسجين مش من القراءات الحالية بمرآة. بنقيس النبض وتباين النبض والتنفس ومؤشر التوتر. للأكسجين استعمل جهاز الإصبع (Oximeter).', eg:'نسبة الأكسجين مش من القراءات الحالية في مرآة. بنقيس النبض وتباين النبض والتنفس ومؤشر التوتر. للأكسجين استخدم جهاز الصباع (Oximeter).', en:'Oxygen saturation is not one of Mir\'ah\'s current readings. We measure heart rate, HRV, breathing and a stress index. Use a fingertip oximeter for SpO2.'},
 {k:/(حراره|حرارتي|سخونه|سخن|مسخن|fever|temperature)/, jo:'مرآة ما بتقيس الحرارة. استعمل ميزان حرارة. الحرارة العالية بترفع النبض، فإذا عندك سخونة نتيجتك رح تنزل مؤقتاً، وهاد طبيعي.', eg:'مرآة مش بتقيس الحرارة. استخدم ترمومتر. السخونية بتعلّي النبض، فلو عندك سخونية نتيجتك هتنزل مؤقتاً، وده طبيعي.', en:'Mir\'ah doesn\'t measure temperature; use a thermometer. Fever raises heart rate, so your score will dip temporarily, which is expected.'},
 {k:/(صداع|راسي بوجعني|وجع راس|headache|migraine)/, jo:'الصداع كثير مرات من قلة المي أو النوم أو التوتر أو الشاشات. اشرب مي، ارتاح بعيد عن الشاشة، وجرّب تنفّس بطيء. إذا كان قوي جداً أو مفاجئ أو معه دوخة، راجع طبيب.', eg:'الصداع كتير بيبقى من قلة المية أو النوم أو التوتر أو الشاشات. اشرب مية، ارتاح بعيد عن الشاشة، وجرّب تنفّس بالراحة. لو جامد أوي أو مفاجئ أو معاه دوخة، روح لدكتور.', en:'Headaches often come from low water, poor sleep, stress or screens. Drink water, rest away from screens and try slow breathing. If it is severe, sudden or comes with dizziness, see a doctor.'},
 {k:/(نبضي عالي|نبض عالي|نبض سريع|نبضي سريع|دقات قلبي|قلبي بدق|خفقان|high heart rate|heart (is )?racing|palpitation|fast heart|heart rate is high)/, jo:'نبض الراحة الطبيعي تقريباً بين 60 و 100. بيرتفع مع القهوة والتوتر وقلة النوم والمي والحرارة. ارتاح 5 دقايق وأعد الفحص. إذا ضل فوق 110 وإنت مرتاح، أو معه ألم أو دوخة، راجع طبيب.', eg:'نبض الراحة الطبيعي تقريباً بين 60 و 100. بيعلى مع القهوة والتوتر وقلة النوم والمية والسخونية. ارتاح 5 دقايق واعمل الفحص تاني. لو فضل فوق 110 وإنت مرتاح، أو معاه وجع أو دوخة، روح لدكتور.', en:'A normal resting heart rate is roughly 60 to 100. Coffee, stress, poor sleep, dehydration and fever raise it. Rest 5 minutes and scan again. If it stays above 110 at rest, or comes with pain or dizziness, see a doctor.'},
 {k:/(نبضي واطي|نبض واطي|نبض بطيء|نبضي بطيء|low heart rate|slow heart)/, jo:'نبض بين 50 و 60 شائع عند الرياضيين وبالنوم. إذا كان تحت 45 وإنت صاحي، أو معه تعب أو دوخة أو إغماء، راجع طبيب.', eg:'نبض بين 50 و 60 منتشر عند الرياضيين وفي النوم. لو تحت 45 وإنت صاحي، أو معاه تعب أو دوخة أو إغماء، روح لدكتور.', en:'A heart rate of 50 to 60 is common in athletes and during sleep. If it is below 45 while awake, or comes with fatigue, dizziness or fainting, see a doctor.'},
 {k:/(نبض طبيعي|النبض الطبيعي|كم النبض|قديش النبض|النبض كام|normal heart rate|resting heart|what is a good heart rate)/, jo:'نبض الراحة الطبيعي للكبار تقريباً من 60 لـ 100 نبضة بالدقيقة، وكل ما كان أهدى ضمن هالمدى عادة أحسن. بمرآة، 51 لـ 75 بياخذ أعلى نقاط براحة القلب.', eg:'نبض الراحة الطبيعي للكبار تقريباً من 60 لـ 100 نبضة في الدقيقة، وكل ما يكون أهدى في المدى ده عادة أحسن. في مرآة، من 51 لـ 75 بياخد أعلى نقاط في راحة القلب.', en:'A normal adult resting heart rate is about 60 to 100 bpm, and calmer within that range is usually better. In Mir\'ah, 51 to 75 earns full points for heart at rest.'},
 {k:/(اشاره ضعيفه|ما طلع رقم|ما في نتيجه|مفيش نتيجه|ما طلعت نتيجه|ليش ما|مطلعتليش|مطلعش|ليه مفيش|ثقه متوسطه|weak signal|no score|didn'?t (get|show)|low confidence)/, jo:'الإشارة الضعيفة عادة من الضو أو الحركة. جرّب: ضو طبيعي قدّام وجهك (جنب شباك)، ثبّت الجوال على إشي، ما تحكي، وبعّد الشعر عن جبهتك. وخلّي المقطع 20 ثانية على الأقل.', eg:'الإشارة الضعيفة غالباً من النور أو الحركة. جرّب: نور طبيعي قدّام وشّك (جنب شباك)، ثبّت الموبايل على حاجة، متتكلمش، وبعّد الشعر عن جبهتك. وخلّي المقطع 20 ثانية على الأقل.', en:'A weak signal usually comes from lighting or movement. Try natural light facing you (near a window), rest the phone on something, don\'t talk, and keep hair off your forehead. Record at least 20 seconds.'},
 {k:/(نظارات|نضارات|نظاره|لحيه|دقن|مكياج|ميك اب|حجاب|بشره سمرا|سمرا|سمراء|اسمر|بشرتي|glasses|beard|makeup|hijab|skin tone|dark skin)/, jo:'عادي! مرآة بتقرأ من الجبهة، فالنظارات واللحية والحجاب ما بيأثروا طالما الجبهة باينة. المكياج الثقيل على الجبهة ممكن يضعّف الإشارة شوي. ومصممة تشتغل مع كل ألوان البشرة، وبنختبرها على هالأساس.', eg:'عادي! مرآة بتقرا من الجبهة، فالنضارة والدقن والحجاب مش بيأثروا طالما الجبهة باينة. الميك أب التقيل على الجبهة ممكن يضعّف الإشارة شوية. ومتصممة تشتغل مع كل ألوان البشرة، وبنختبرها على الأساس ده.', en:'No problem! Mir\'ah reads from the forehead, so glasses, beards and hijab don\'t matter as long as the forehead is visible. Heavy makeup on the forehead can weaken the signal a little. It is designed for all skin tones and we test it that way.'},
 {k:/(كم مره|قديش لازم|اديش لازم|كل يوم|كل قديش|امتي افحص|متى افحص|احسن وقت|افضل وقت|how often|best time|when should i)/, jo:'مرة باليوم بتكفي، وأحسن إشي الصبح بعد ما تصحى وقبل القهوة، بنفس الوقت كل يوم. هيك المقارنة بين الأيام بتكون عادلة، وبتاخذ نقاط الانتظام كاملة.', eg:'مرة في اليوم كفاية، وأحسن حاجة الصبح بعد ما تصحى وقبل القهوة، في نفس المعاد كل يوم. كده المقارنة بين الأيام بتبقى مظبوطة، وبتاخد نقاط الانتظام كاملة.', en:'Once a day is enough, ideally in the morning after waking and before coffee, at the same time each day. That keeps day-to-day comparisons fair and earns full consistency points.'},
 {k:/(تحدي|انتظام|ستريك|challenge|streak|consisten)/, jo:'نقاط الانتظام (10 من 100) بتجي من عدد أيام الفحص بآخر 7 أيام. وبمرآة في تحدي 7 أيام: افحص كل يوم أسبوع كامل وبتشوف كيف عاداتك بتأثر على نتيجتك.', eg:'نقاط الانتظام (10 من 100) بتيجي من عدد أيام الفحص في آخر 7 أيام. وفي مرآة تحدي 7 أيام: اعمل الفحص كل يوم أسبوع كامل وهتشوف عاداتك بتأثر على نتيجتك إزاي.', en:'Consistency points (10 of 100) come from how many of the last 7 days you scanned. Mir\'ah also has a 7-day challenge: scan daily for a week and see how your habits shape your score.'},
 {k:/(اطفال|طفل|ولادي|ابني|بنتي|(^|\s)(عمر|عمري|ستي|سيدي|جدي|جدتي)|كبار السن|kids|child|children|age|elderly|grandm|grandp)/, jo:'مرآة للكبار من 18 سنة وفوق. كبار السن بيقدروا يستعملوها عادي، وباقة العيلة بتخليك تتابع أهلك بموافقتهم. للأطفال، النطاقات الطبيعية مختلفة فما بننصح فيها هلّق.', eg:'مرآة للكبار من 18 سنة وطالع. كبار السن يقدروا يستخدموها عادي، وباقة العيلة بتخليك تتابع أهلك بموافقتهم. للأطفال، المعدلات الطبيعية مختلفة فمش بننصح بيها دلوقتي.', en:'Mir\'ah is for adults 18 and over. Older adults can use it normally, and the Family plan lets you follow your parents with their consent. Normal ranges differ for children, so we don\'t recommend it for kids yet.'},
 {k:/(حامل|(^|\s)(حمل|بحمل)|pregnan)/, jo:'بالحمل النبض الطبيعي بيرتفع، فالنتيجة ممكن تنزل وهاد متوقع. مرآة بتنفع كمؤشر عافية عام، بس متابعة الحمل لازم تكون مع طبيبتك.', eg:'في الحمل النبض الطبيعي بيعلى، فالنتيجة ممكن تنزل وده متوقع. مرآة تنفع كمؤشر عافية عام، بس متابعة الحمل لازم تكون مع دكتورتك.', en:'During pregnancy resting heart rate naturally rises, so your score may dip, which is expected. Mir\'ah works as a general wellness indicator, but pregnancy care should be with your doctor.'},
 {k:/(تقرير|ريبورت|pdf|اشارك|شارك|ابعت للدكتور|ابعث للطبيب|report|share)/, jo:'ببلس والعيلة بيجيك تقرير أسبوعي فيه نتيجتك واتجاهات النبض والتوتر والنوم، وبتشاركه مع طبيبك بكبسة. وبهالنموذج التجريبي، "تقرير اليوم" تحت النتيجة بيلخّصلك قراءتك.', eg:'في بلس والعيلة بيوصلك تقرير أسبوعي فيه نتيجتك واتجاهات النبض والتوتر والنوم، وتشاركه مع دكتورك بضغطة. وفي النموذج التجريبي ده، "تقرير النهارده" تحت النتيجة بيلخّصلك قراءتك.', en:'Plus and Family include a weekly report with your score and trends in heart rate, stress and sleep, shareable with your doctor in one tap. In this prototype, "Today\'s report" under the score summarises your reading.'},
 {k:/(تشخيص|بشخص|بتشخص|تشخص|جهاز طبي|بديل (عن )?(الدكتور|الطبيب)|بغني عن|diagnos|medical device|replace (a |my )?doctor)/, jo:'لا، مرآة منتج عافية مش جهاز طبي، وبتعطي مؤشرات تقديرية مش تشخيص. وظيفتها تنبّهك لعاداتك وتساعدك تحكي مع طبيبك بأرقام واضحة.', eg:'لأ، مرآة منتج عافية مش جهاز طبي، وبتدي مؤشرات تقديرية مش تشخيص. شغلتها تنبّهك لعاداتك وتساعدك تتكلم مع دكتورك بأرقام واضحة.', en:'No. Mir\'ah is a wellness product, not a medical device, and it gives estimated indicators, not diagnoses. It helps you notice your habits and talk to your doctor with clear numbers.'},
 {k:/(تابع|اتابع|متابعه|(^|\s)(اهلي|امي|ابوي|ابويا|ماما|بابا)(\s|$|\?)|parents|my mom|my dad|follow|monitor (my )?(family|parents))/, jo:'بباقة العيلة (3.99$ بالشهر) بتضيف لحد 5 أفراد، وبتشوف نتيجتهم اليومية بموافقتهم، حتى لو ببلد ثاني. وإذا نتيجة حدا نزلت كثير بيوصلك تنبيه لطيف تطمّن عليه.', eg:'في باقة العيلة (3.99$ في الشهر) تضيف لحد 5 أفراد، وتشوف نتيجتهم اليومية بموافقتهم، حتى لو في بلد تاني. ولو نتيجة حد نزلت أوي بيوصلك تنبيه لطيف تطمّن عليه.', en:'With the Family plan ($3.99/month) you add up to 5 people and see their daily score with their consent, even from another country. If someone\'s score drops sharply, you get a gentle nudge to check in.'},
 {k:/(شركه|شركات|موظف|موظفين|للاعمال|بزنس|موارد بشريه|business|company|employee|corporate|\bhr\b)/, jo:'مرآة للأعمال بـ 1$ للموظف بالشهر: لوحة عافية مجمّعة للفريق بتوري التوتر والطاقة بشكل عام، بدون ما تكشف بيانات أي موظف لحاله.', eg:'مرآة للأعمال بـ 1$ للموظف في الشهر: لوحة عافية مجمّعة للفريق بتوري التوتر والطاقة بشكل عام، من غير ما تكشف بيانات أي موظف لوحده.', en:'Mir\'ah Business is $1 per employee per month: an aggregated team wellbeing dashboard showing overall stress and energy, without revealing any individual\'s data.'},
 {k:/(ادفع|الدفع|دفع|فيزا|ماستر|بطاقه|كليك|cliq|efawateer|فوري|فودافون كاش|محفظه|pay|payment|card|wallet|fawry)/, jo:'بالأردن بتدفع بالدينار عن طريق CliQ أو eFAWATEERcom أو البطاقة. والأسعار رمزية: بلس 1.99$ والعيلة 3.99$ بالشهر.', eg:'في مصر بتدفع بالجنيه عن طريق فوري أو المحافظ الإلكترونية زي فودافون كاش أو بالكارت. والأسعار رمزية: بلس 1.99$ والعيلة 3.99$ في الشهر.', en:'In Jordan: CliQ, eFAWATEERcom or card, in dinars. In Egypt: Fawry, mobile wallets or card, in pounds. Prices are symbolic: Plus $1.99 and Family $3.99 a month.'},
 {k:/(الغاء|الغي|بلغي|استرجاع|استرداد|ارجاع فلوس|cancel|refund|unsubscribe)/, jo:'بتقدر تلغي الاشتراك بأي وقت من الإعدادات بكبسة، وبتضل الباقة شغالة لآخر الشهر المدفوع. وبعدها بترجع للمجاني بدون ما تخسر سجلّك.', eg:'تقدر تلغي الاشتراك في أي وقت من الإعدادات بضغطة، والباقة بتفضل شغالة لآخر الشهر المدفوع. وبعدها بترجع للمجاني من غير ما تخسر سجلّك.', en:'You can cancel anytime from settings in one tap; your plan stays active until the end of the paid month, then you return to Free without losing your history.'},
 {k:/(مجاني|ببلاش|فري|تجربه مجانيه|free|trial)/, jo:'في باقة مجانية للأبد: فحص يومي، والنتيجة من 100، و 5 أسئلة للمساعد باليوم. وإذا بدك أكثر، بلس بـ 1.99$ بس.', eg:'فيه باقة مجانية على طول: فحص يومي، والنتيجة من 100، و 5 أسئلة للمساعد في اليوم. ولو عايز أكتر، بلس بـ 1.99$ بس.', en:'There is a free plan forever: a daily scan, your score out of 100, and 5 assistant questions a day. Want more? Plus is just $1.99.'},
 {k:/(لغه|لغات|لهجه|انجليزي|انكليزي|عربي|مصري|اردني|language|english|arabic|dialect)/, jo:'مرآة بتحكي أردني أو مصري أو إنجليزي، وبتختار من الأزرار فوق. والمساعد بيرد عليك بنفس اللهجة اللي اخترتها.', eg:'مرآة بتتكلم أردني أو مصري أو إنجليزي، وبتختار من الزراير اللي فوق. والمساعد بيرد عليك بنفس اللهجة اللي اخترتها.', en:'Mir\'ah speaks Jordanian Arabic, Egyptian Arabic or English; switch with the buttons at the top. The assistant replies in the language you choose.'},
 {k:/(وين|فين|متوفر|متاح|دول|بلد|بلاد|السعوديه|الخليج|الامارات|الكويت|قطر|العراق|سوريا|لبنان|فلسطين|المغرب|countr|available|saudi|gulf|uae)/, jo:'منطلقين بالأردن أولاً وبعدها مصر. وبعد ما نثبت النجاح هناك، الخطة نتوسّع لباقي الدول العربية.', eg:'بنبدأ في الأردن الأول وبعدها مصر. وبعد ما ننجح هناك، الخطة نتوسّع لباقي الدول العربية.', en:'We launch in Jordan first, then Egypt. Once we prove it there, the plan is to expand across the Arab world.'},
 {k:/((^|\s)(انزل|نزل) (التطبيق|الابليكيشن|البرنامج)|تحميل|احمل|ابل ستور|اب ستور|جوجل بلاي|قوقل بلاي|اندرويد|ايفون|download|app store|google play|android|iphone|ios)/, jo:'التطبيق لسا بالمرحلة التجريبية، وهاي نسخة تجريبية بتشتغل من المتصفح على أي جوال (آيفون أو أندرويد). وقت الإطلاق رح يكون على App Store و Google Play.', eg:'التطبيق لسه في المرحلة التجريبية، ودي نسخة تجريبية بتشتغل من المتصفح على أي موبايل (آيفون أو أندرويد). وقت الإطلاق هيكون على App Store و Google Play.', en:'The app is still in its pilot phase; this is a prototype that runs in the browser on any phone (iPhone or Android). At launch it will be on the App Store and Google Play.'},
 {k:/(كيف بتشتغل|كيف بتعرف|كيف بتقيس|بتشتغل ازاي|بتعرف ازاي|تقنيه|كاميرا بتقيس|rppg|how does (it|this) work|how do you measure|camera measure)/, jo:'مع كل نبضة بيندفع دم بالشعيرات تحت جلد الوجه وبيتغيّر لونه تغيير صغير ما بتشوفه العين. الكاميرا بتلقط هالتغيير من الجبهة (تقنية rPPG)، ومنه بنحسب النبض وتباينه والتنفس.', eg:'مع كل نبضة الدم بيندفع في الشعيرات تحت جلد الوش ولونه بيتغيّر تغيير صغير العين مش بتشوفه. الكاميرا بتلقط التغيير ده من الجبهة (تقنية rPPG)، ومنه بنحسب النبض وتباينه والتنفس.', en:'With each heartbeat, blood pulses through tiny vessels under your facial skin and its colour shifts slightly, invisible to the eye. The camera picks this up from your forehead (rPPG) and we compute heart rate, HRV and breathing.'},
 {k:/(احذف|امسح|حذف|مسح بياناتي|delete|erase|remove my data)/, jo:'بتقدر تحذف كل بياناتك من الإعدادات بأي وقت، وبتنمسح نهائياً. وأصلاً الفيديو ما بينحفظ ولا بينرفع، بس الأرقام.', eg:'تقدر تمسح كل بياناتك من الإعدادات في أي وقت، وبتتمسح نهائي. وأصلاً الفيديو مش بيتحفظ ولا بيترفع، الأرقام بس.', en:'You can delete all your data from settings at any time, permanently. The video is never stored or uploaded anyway, only the numbers.'},
 {k:/(حساب|تسجيل|سجل|اسجل|كلمه سر|باسورد|login|log in|sign up|signup|account|password)/, jo:'بالتطبيق بتسجّل برقم جوالك أو إيميلك. بهالنسخة التجريبية ما في حاجة لحساب، كل إشي بيضل على جهازك.', eg:'في التطبيق بتسجّل برقم موبايلك أو إيميلك. في النسخة التجريبية دي مفيش داعي لحساب، كل حاجة بتفضل على جهازك.', en:'In the app you sign up with your phone number or email. This prototype needs no account; everything stays on your device.'},
 {k:/(مين عمل|مين وراكم|مين صمم|مين انتو|الشركه|الفريق|فريق|who (made|built|is behind)|team|about (you|mirah|the company))/, jo:'مرآة شركة ناشئة عربية، منطلقة من الأردن، هدفها تخلي فحص العافية اليومي سهل وبسعر رمزي لكل بيت عربي، بس بكاميرا الجوال.', eg:'مرآة شركة ناشئة عربية، بادئة من الأردن، هدفها تخلّي فحص العافية اليومي سهل وبسعر رمزي لكل بيت عربي، بكاميرا الموبايل بس.', en:'Mir\'ah is an Arab startup launching from Jordan, on a mission to make a daily wellness check easy and affordable for every Arab home, using just a phone camera.'},
 {k:/(استثمار|مستثمر|استثمر|تمويل|invest|funding|raise)/, jo:'بنجمع جولة تأسيسية 800 ألف دولار لـ 18 شهر، للإطلاق بالأردن ومصر ودراسة الدقة. التفاصيل الكاملة بعرض المستثمرين وخطة العمل.', eg:'بنجمع جولة تأسيسية 800 ألف دولار لـ 18 شهر، للإطلاق في الأردن ومصر ودراسة الدقة. التفاصيل الكاملة في عرض المستثمرين وخطة العمل.', en:'We are raising an $800k seed round for 18 months, to launch in Jordan and Egypt and run our accuracy study. Full details are in the investor deck and business plan.'},
 {k:/((^|\s)(وزن|اكل|اكلي)|رجيم|دايت|غذاء|سعرات|diet|weight|food|eat|calorie)/, jo:'الأكل الثقيل بالليل بيرفع النبض وقت النوم وبينزّل نتيجة الصبح. وجبة خفيفة قبل النوم بـ 3 ساعات، خضار أكثر، وسكر أقل، بيبيّنوا بنتيجتك خلال أيام.', eg:'الأكل التقيل بالليل بيعلّي النبض وقت النوم وبينزّل نتيجة الصبح. وجبة خفيفة قبل النوم بـ 3 ساعات، خضار أكتر، وسكر أقل، هتبان في نتيجتك خلال أيام.', en:'Heavy meals late at night raise your heart rate during sleep and lower your morning score. A light dinner 3 hours before bed, more vegetables and less sugar show up in your score within days.'},
 {k:/(تنفس|بتنفس|نفس بالدقيقه|معدل التنفس|breathing rate|respirat)/, jo:'معدل التنفس الطبيعي وإنت مرتاح من 12 لـ 20 نَفَس بالدقيقة. بمرآة بنطلّعه من حركة الإشارة البطيئة، وبياخذ 15 نقطة من النتيجة.', eg:'معدل التنفس الطبيعي وإنت مرتاح من 12 لـ 20 نَفَس في الدقيقة. في مرآة بنطلّعه من حركة الإشارة البطيئة، وبياخد 15 نقطة من النتيجة.', en:'A normal resting breathing rate is 12 to 20 breaths per minute. Mir\'ah derives it from the slow component of the signal, and it is worth 15 points of your score.'}
];
const MY_SCORE = /(نتيجتي|نتيجتك|رقمي|my score|my result)/;

const FAQ = [
 {k:/(نتيج|score|100|تنحسب|بتتحسب|calculat)/i, jo:'نتيجة مرآة رقم من 100 بيلخّص حالتك اليوم: راحة القلب 25، التوازن والتوتر 30، التنفس 15، النوم والشعور 20، والانتظام 10. من 75 وفوق ممتاز، من 50 لـ 74 منيح، وتحت 50 يعني جسمك محتاج انتباه اليوم، مش تشخيص.', eg:'نتيجة مرآة رقم من 100 بيلخّص حالتك النهارده: راحة القلب 25، التوازن والتوتر 30، التنفس 15، النوم والإحساس 20، والانتظام 10. من 75 وطالع ممتاز، من 50 لـ 74 كويس، وتحت 50 معناه إن جسمك محتاج انتباه النهارده، مش تشخيص.', en:'Your Mir\'ah Score sums up today out of 100: heart at rest 25, balance and stress 30, breathing 15, sleep and mood 20, consistency 10. 75+ is excellent, 50 to 74 is good, under 50 means your body needs some attention today. It is an indicator, not a diagnosis.'},
 {k:/(سعر|اسعار|أسعار|بكام|قديش|باق|عيل|price|plan|cost|family|\$)/i, jo:'الأسعار رمزية: المجاني ببلاش، بلس 1.99$ بالشهر (أو 14.99$ بالسنة)، العيلة 3.99$ بالشهر لحد 5 أفراد، وللشركات 1$ للموظف. بتدفع بالدينار عن طريق CliQ أو eFAWATEERcom.', eg:'الأسعار رمزية: المجاني ببلاش، بلس 1.99$ في الشهر (أو 14.99$ في السنة)، العيلة 3.99$ في الشهر لحد 5 أفراد، وللشركات 1$ للموظف. بتدفع بالجنيه عن طريق فوري أو المحافظ الإلكترونية.', en:'Prices are symbolic: Free costs nothing, Plus is $1.99/month (or $14.99/year), Family is $3.99/month for up to 5 people, and Business is $1 per employee. You pay in local currency (CliQ or eFAWATEERcom in Jordan, Fawry or mobile wallets in Egypt).'},
 {k:/(فيديو|خصوص|بينحفظ|بيتحفظ|بيانات|privacy|video|stored|data)/i, jo:'لا، الفيديو بيتحلّل على جوالك وما بينرفع لأي سيرفر. بنحفظ الأرقام بس، ومشفّرة، حسب قانون حماية البيانات الأردني.', eg:'لأ، الفيديو بيتحلّل على موبايلك ومش بيترفع على أي سيرفر. بنحفظ الأرقام بس ومتشفّرة، حسب قانون حماية البيانات المصري.', en:'No. The video is analysed on your phone and never uploaded. Only the numbers are kept, encrypted, under Jordanian and Egyptian data-protection laws.'},
 {k:/(نوم|نمت|sleep)/i, jo:'لنوم أحسن: نام وصحى بنفس الوقت، بلاش شاشات قبل النوم بنص ساعة، خفّف القهوة بعد العصر، وخلّي الغرفة معتمة وباردة. ومرآة رح توريك أثر هالإشي على نتيجتك.', eg:'عشان تنام أحسن: نام واصحى في نفس المعاد، بلاش شاشات قبل النوم بنص ساعة، قلّل القهوة بعد العصر، وخلّي الأوضة ضلمة وباردة. ومرآة هتوريك تأثير ده على نتيجتك.', en:'For better sleep: keep the same bed and wake times, no screens for 30 minutes before bed, less caffeine after mid-afternoon, and a dark, cool room. Mir\'ah will show you the effect on your score.'},
 {k:/(تباين|hrv|توتر|stress)/i, jo:'تباين النبض هو الفرق الصغير بين نبضة ونبضة. كل ما كان أعلى، جسمك أهدى وأقدر يتعامل مع الضغط. التوتر وقلة النوم بينزّلوه، والتنفس البطيء والمشي بيرفعوه.', eg:'تباين النبض هو الفرق الصغير بين كل نبضة والتانية. كل ما يكون أعلى، جسمك أهدى وقادر يستحمل الضغط. التوتر وقلة النوم بيقلّلوه، والتنفس البطيء والمشي بيعلّوه.', en:'HRV is the tiny variation between heartbeats. Higher usually means a calmer body that handles pressure better. Stress and poor sleep lower it; slow breathing and walking raise it.'},
 {k:/(دقيق|دقة|موثوق|ثقة|accura|trust)/i, jo:'مع كل نتيجة بنعرضلك درجة ثقة، وإذا الإشارة ضعيفة ما بنعطيك رقم أصلاً. وبنخطط لدراسة مقارنة مع أجهزة طبية على 500 مشارك وبننشر نتائجها زي ما هي.', eg:'مع كل نتيجة بنعرضلك درجة الثقة، ولو الإشارة ضعيفة مش بنديك رقم خالص. وبنخطط لدراسة مقارنة مع أجهزة طبية على 500 مشارك وهننشر نتايجها زي ما هي.', en:'Every score comes with a confidence level, and if the signal is weak we show no number at all. We plan a comparison study against medical devices with 500 participants and will publish the results as they are.'},

function fft(re, im){ const n=re.length; for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]];}}
  for(let len=2;len<=n;len<<=1){const a=-2*Math.PI/len,wr=Math.cos(a),wi=Math.sin(a);for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let j=0;j<len/2;j++){const ur=re[i+j],ui=im[i+j],k=i+j+len/2,vr=re[k]*cr-im[k]*ci,vi=re[k]*ci+im[k]*cr;re[i+j]=ur+vr;im[i+j]=ui+vi;re[k]=ur-vr;im[k]=ui-vi;const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t;}}}}
function resample(ts, vals, fs){ const out=[]; const t0=ts[0], t1=ts[ts.length-1]; let j=0;
  for(let t=t0;t<=t1;t+=1/fs){ while(j<ts.length-2 && ts[j+1]<t) j++; const a=ts[j], b=ts[j+1]; const f=b>a?(t-a)/(b-a):0; out.push(vals[j]+(vals[j+1]-vals[j])*Math.max(0,Math.min(1,f))); } return out; }
function detrend(x, win){ const out=new Array(x.length); let s=0; const q=[]; const h=Math.floor(win/2);
  const pre=[0]; for(const v of x) pre.push(pre[pre.length-1]+v);
  for(let i=0;i<x.length;i++){ const a=Math.max(0,i-h), b=Math.min(x.length,i+h+1); out[i]=x[i]-(pre[b]-pre[a])/(b-a);} return out; }
function std(x){const m=x.reduce((a,b)=>a+b,0)/x.length;return Math.sqrt(x.reduce((a,b)=>a+(b-m)**2,0)/x.length)||1e-9;}
function bandpass(x, fs, lo, hi){ let n=1; while(n<x.length*2) n<<=1; const re=new Float64Array(n), im=new Float64Array(n); x.forEach((v,i)=>re[i]=v);
  fft(re,im); const spec=[]; for(let k=0;k<n;k++){ const f=Math.min(k,n-k)*fs/n; if(f<lo||f>hi){re[k]=0;im[k]=0;} if(k<n/2) spec.push({f, p:re[k]*re[k]+im[k]*im[k]}); }
  for(let k=0;k<n;k++) im[k]=-im[k]; fft(re,im); const y=[]; for(let i=0;i<x.length;i++) y.push(re[i]/n); return {y, spec}; }
function chrom(R,G,B){ const mr=R.reduce((a,b)=>a+b)/R.length, mg=G.reduce((a,b)=>a+b)/G.length, mb=B.reduce((a,b)=>a+b)/B.length;
  const X=[],Y=[]; for(let i=0;i<R.length;i++){const r=R[i]/mr,g=G[i]/mg,b=B[i]/mb; X.push(3*r-2*g); Y.push(1.5*r+g-1.5*b);} const a=std(X)/std(Y); return X.map((v,i)=>v-a*Y[i]); }
function analyze(ts, R, G, B){
  const r=resample(ts,R,FS), g=resample(ts,G,FS), b=resample(ts,B,FS);
  const raw=chrom(r,g,b); const x=detrend(raw, FS*1.5);
  const {y, spec}=bandpass(x, FS, 0.7, 3.0);
  let best={f:0,p:0}, tot=0; for(const s of spec){ if(s.f>=0.7&&s.f<=3.0){ tot+=s.p; if(s.p>best.p) best=s; } }
  let near=0; for(const s of spec){ if(Math.abs(s.f-best.f)<0.08 || Math.abs(s.f-2*best.f)<0.08) near+=s.p; }
  const snr = near/Math.max(tot-near,1e-12);
  const hr = best.f*60;
  // peaks for HRV
  const minGap=Math.floor(FS*60/Math.min(180,hr*1.45)); const peaks=[];
  for(let i=2;i<y.length-2;i++){ if(y[i]>y[i-1]&&y[i]>=y[i+1]&&y[i]>0){ if(!peaks.length||i-peaks[peaks.length-1]>=minGap) peaks.push(i); else if(y[i]>y[peaks[peaks.length-1]]) peaks[peaks.length-1]=i; } }
  const ibi=[]; for(let i=1;i<peaks.length;i++) ibi.push((peaks[i]-peaks[i-1])/FS*1000);
  const med=[...ibi].sort((a,b)=>a-b)[Math.floor(ibi.length/2)]||60000/hr; const clean=ibi.filter(v=>Math.abs(v-med)<med*0.25);

  const slow=bandpass(detrend(raw, FS*12), FS, 0.1, 0.5); let rb={f:0,p:0}; for(const s of slow.spec){ if(s.f>=0.12&&s.f<=0.5&&s.p>rb.p) rb=s; }

}


function synth(){ const ts=[],R=[],G=[],B=[]; let ph=0; let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647-.5;};
  for(let i=0;i<FS*MAX_SEC;i++){ const t=i/FS; const inst=72+3.2*Math.sin(2*Math.PI*0.25*t)+1.2*Math.sin(2*Math.PI*0.07*t); ph+=2*Math.PI*inst/60/FS;
    const breath=Math.sin(2*Math.PI*0.25*t); const pulse=(Math.sin(ph)+0.35*Math.sin(2*ph-0.6))*(1+0.15*breath);
    ts.push(t); R.push(150+0.25*pulse+0.4*breath+0.25*rnd()); G.push(110+0.9*pulse+0.5*breath+0.3*rnd()); B.push(90+0.15*pulse+0.3*breath+0.25*rnd()); }
  return {ts,R,G,B}; }

const clamp01 = v => Math.max(0, Math.min(1, v));
function scanDays(){ try{ return JSON.parse(store.get('mirah.days')||'[]'); }catch(e){ return []; } }
function score(r){
  if(!r || r.quality==='bad') return null;
  const heart = 25*clamp01(1 - Math.max(0, Math.abs(r.hr-63)-12)/35);
  const bal = r.rmssd ? 30*clamp01((r.rmssd-10)/50) : 15;
  const resp = r.resp ? 15*clamp01(1 - Math.max(0, Math.abs(r.resp-16)-4)/10) : 8;
  const sl = [3,7,10,8][$('sleep').selectedIndex] , md = [10,7,4,4][$('mood').selectedIndex];
  const days = scanDays(), today = new Date().toISOString().slice(0,10);
  const week = days.filter(d => (Date.parse(today)-Date.parse(d))/864e5 < 7).length;
  const cons = week ? Math.min(10, Math.round(week*10/7)+3) : 5;
  const parts = [heart, bal, resp, sl+md, cons].map(Math.round);
  return {total: parts.reduce((a,b)=>a+b,0), parts, max:[25,30,15,20,10]};
}

const AI_URL = '';
async function askRemote(q){
  const r = await fetch(AI_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({q, lang, context: contextText(), history: history.slice(-4)})});
  if(!r.ok) throw new Error('http '+r.status); const j = await r.json(); if(!j.text) throw new Error('empty'); return j.text; }
// topic tabs + suggested questions
let topicIdx = 0; const asked = new Set();
function renderTopics(){ const L=T[lang]; $('tabs').innerHTML=''; L.topics.forEach((t,i)=>{ const b=document.createElement('button'); b.type='button'; b.setAttribute('role','tab'); b.setAttribute('aria-selected', i===topicIdx); b.textContent=t[0]; b.onclick=()=>{ topicIdx=i; renderTopics(); }; $('tabs').append(b); });
  $('chips').innerHTML=''; L.topics[topicIdx][1].forEach(c => { const b=document.createElement('button'); b.type='button'; b.textContent=c; b.onclick=()=>ask(c); $('chips').append(b); }); }
function followUps(){ document.querySelectorAll('#chat .follow').forEach(e=>e.remove()); const L=T[lang];
  const pool=[]; for(let k=1;k<=L.topics.length;k++){ const t=L.topics[(topicIdx+k)%L.topics.length][1]; t.forEach(q=>{ if(!asked.has(q)) pool.push(q); }); }
  const picks=[]; for(let k=0;k<L.topics.length && picks.length<3;k++){ const t=L.topics[(topicIdx+1+k)%L.topics.length][1].filter(q=>!asked.has(q)); if(t.length) picks.push(t[0]); }
  pool.forEach(q=>{ if(picks.length<3 && !picks.includes(q)) picks.push(q); }); if(!picks.length) return;
  const d=document.createElement('div'); d.className='follow'; const lab=document.createElement('small'); lab.className='muted'; lab.style.width='100%'; lab.textContent=L.more; d.append(lab);
  picks.forEach(q=>{ const b=document.createElement('button'); b.type='button'; b.textContent=q; b.onclick=()=>ask(q); d.append(b); }); $('chat').append(d); $('chat').scrollTop=$('chat').scrollHeight; }
async function ask(q){ q=(q||'').trim(); if(!q) return; asked.add(q); document.querySelectorAll('#chat .follow').forEach(e=>e.remove()); await askCore(q); followUps(); }
async function askCore(q){
  const L=T[lang]; bubble('me',q);
  if(!sampleFn && AI_URL){ const out=bubble('ai',L.thinking); $('askBtn').disabled=true;
    try{ const text=await askRemote(q); out.textContent=text; history.push({q,a:text}); }
    catch(e){ const a=faqAnswer(q); out.textContent=a||FAQ_MISS[lang]; if(a){ const s=document.createElement('small'); s.textContent=L.faqTag; out.append(s); } }
    finally{ $('askBtn').disabled=false; $('chat').scrollTop=$('chat').scrollHeight; } return; }
  if(!sampleFn){ const a=faqAnswer(q); bubble('ai', a||FAQ_MISS[lang], a?L.faqTag:''); return; }
  const out=bubble('ai',L.thinking); $('askBtn').disabled=true;
  const recent = history.slice(-4);
  const msgs = []; const head = `${RULES}\n${L.dialect}\n\n${KB}\n\n${contextText()}\n\nأجب في 70 كلمة أو أقل، بنفس اللغة واللهجة المطلوبة.\n\nسؤال المستخدم: `;
  if(recent.length){ recent.forEach((t,i)=>{ msgs.push({role:'user',content:(i===0?head:'')+t.q}); msgs.push({role:'assistant',content:t.a}); }); msgs.push({role:'user',content:q}); }
  else msgs.push({role:'user',content:head+q});
  try{ const {text}=await sampleFn(msgs,{cache:false,modelTier:'quick',onText:({text})=>{ out.textContent=text; }}); out.textContent=text; history.push({q,a:text}); }
  catch(err){ if(err&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(err.code)){ sampleFn=null; const a=faqAnswer(q); out.textContent=a||FAQ_MISS[lang]; }
    else out.textContent=(err&&err.text)||L.aiErr; }
  finally{ $('askBtn').disabled=false; $('chat').scrollTop=$('chat').scrollHeight; }
}
$('askForm').addEventListener('submit', e=>{ e.preventDefault(); const q=$('ask').value; $('ask').value=''; ask(q); });

// ---------- boot ----------
applyLang();
(function boot(){ const s=synth(); show(analyze(s.ts,s.R,s.G,s.B),true); setStatus('boot'); })();
window.addEventListener('resize',()=>{ if(current) drawSig(current.y); if(!$('roi').hidden) placeRoi(); });
(async()=>{ try{ sampleFn = window.claude ? await window.claude.use('sample') : null; }catch(e){ sampleFn=null; } if(!sampleFn){ $('coachSrc').dataset.off='1'; $('coachSrc').textContent=T[lang].srcOff; } })();
</script>
