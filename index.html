<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="مرآة: سيلفي فيديو 30 ثانية بيعطيك نتيجة صحية من 100 ومساعد ذكي بلهجتك.">
<link rel="icon" type="image/png" href="mirah-app-icon.png">
<style>body{margin:0}img{max-width:100%}</style>
<title>مرآة: نتيجتك من 100</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --night:#14203A; --lapis:#2557A7; --rose:#E06C5A; --gold:#F2B33D; --olive:#4F8A5B; --cream:#FFF7EC;
  --bg:#FFF7EC; --surface:#FFFFFF; --mist:#E9EEF6; --fg:#14203A; --muted:#5A6478; --line:#E6DFD3;
  --accent:#2557A7; --on-accent:#FFFFFF; --rose-ink:#B4473A; --olive-ink:#2F6B3C; --pulse:#14203A;
  --display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif; --body:'IBM Plex Sans Arabic','Readex Pro',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1626;--surface:#16223A;--mist:#1E2C47;--fg:#F3EEE6;--muted:#A9B3C6;--line:#2A3955;--accent:#7EA6F2;--on-accent:#0E1626;--rose-ink:#F09A8C;--olive-ink:#A6D9B1;--pulse:#FFF7EC;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1626;--surface:#16223A;--mist:#1E2C47;--fg:#F3EEE6;--muted:#A9B3C6;--line:#2A3955;--accent:#7EA6F2;--on-accent:#0E1626;--rose-ink:#F09A8C;--olive-ink:#A6D9B1;--pulse:#FFF7EC;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.25}
h2{font-size:clamp(26px,3.6vw,40px);font-weight:700}
h3{font-size:18px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--rose-ink)}
section{padding-block:72px}
.sec-head{display:flex;flex-direction:column;gap:10px;max-width:680px;margin-bottom:36px}
/* nav */
nav{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:38px;height:38px;color:var(--pulse)}
.brand b{font-family:var(--display);font-size:22px;line-height:1}
.brand small{display:block;font-family:var(--display);font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:600}
.links{display:flex;gap:18px;font-size:14px}
.links a{text-decoration:none;color:var(--muted)} .links a:hover{color:var(--fg)}
.lang{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang button{font-family:var(--display);font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.btn{font-family:var(--display);font-weight:600;font-size:15px;border-radius:14px;padding:13px 22px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.gold{background:var(--gold);color:#14203A}
.btn.ghost{border-color:var(--line);color:var(--fg)}
.btn:focus-visible,.lang button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* hero */
.hero{padding-block:56px 40px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center}
.hero h1{font-size:clamp(40px,6.4vw,76px);font-weight:700;color:var(--accent)}
.hero h1 span{display:block;color:var(--fg);font-size:.5em;font-weight:600;margin-top:10px}
.hero .lead{font-size:19px;color:var(--muted);max-width:560px;margin-top:18px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.markets{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.chip{font-family:var(--display);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.visual{position:relative;min-width:0}
.visual img{width:100%;max-width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:28px;display:block}
.scorecard{position:absolute;inset-inline-start:-18px;bottom:24px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 18px 40px rgba(20,32,58,.18);max-width:calc(100% - 20px)}
.scorecard svg{width:86px;height:86px;flex:none}
.scorecard b{font-family:var(--display);font-size:15px;display:block}
.scorecard span{font-size:13px;color:var(--muted)}
.askcard{position:absolute;inset-inline-end:-14px;top:28px;background:var(--night);color:var(--cream);border-radius:18px;padding:12px 14px;max-width:250px;font-size:14px;box-shadow:0 18px 40px rgba(20,32,58,.25)}
.askcard em{font-style:normal;color:var(--gold);font-family:var(--display);font-weight:600;font-size:12px;display:block}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.step .n{font-family:var(--display);font-weight:700;font-size:15px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--mist);color:var(--accent)}
/* score */
.score{background:var(--surface);border-block:1px solid var(--line)}
.score .wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px;align-items:center}
.ringbig{position:relative;max-width:340px;width:100%;margin-inline:auto}
.ringbig svg{width:100%;height:auto;display:block}
.parts{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.part{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 48px;gap:12px;align-items:center;font-size:15px}
.part .bar{height:10px;border-radius:10px;background:var(--mist);overflow:hidden}
.part .bar i{display:block;height:100%;border-radius:10px;background:var(--accent)}
.part em{font-style:normal;font-family:var(--display);font-weight:600;text-align:end}
.bands{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.band{font-family:var(--display);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px}
.b1{background:#F6D2CB;color:#9A3527}.b2{background:#FBE6BC;color:#7A5600}.b3{background:#D3E6D6;color:#2F6B3C}
/* assistant */
.assist{background:var(--night);color:var(--cream)}
.assist .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.assist .eyebrow{color:var(--gold)}
.assist .muted{color:#C3CBDA}
.chat{display:flex;flex-direction:column;gap:10px;background:rgba(255,247,236,.06);border:1px solid rgba(255,247,236,.12);border-radius:24px;padding:20px}
.bub{padding:11px 15px;border-radius:18px;max-width:86%;font-size:15px}
.bub.me{background:var(--lapis);color:#fff;align-self:flex-start;border-end-start-radius:4px}
.bub.ai{background:var(--cream);color:var(--night);align-self:flex-end;border-end-end-radius:4px}
.bub.ai small{display:block;color:#7A5600;font-family:var(--display);font-weight:600;font-size:11.5px}
.assist ul{margin:18px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.assist li{display:flex;gap:10px;align-items:flex-start}
.assist li::before{content:"";flex:none;width:10px;height:10px;margin-top:9px;background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
/* audiences */
.aud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .tag{font-family:var(--display);font-size:12px;font-weight:600;color:var(--rose-ink)}
.family{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;margin-top:40px}
.family img{width:100%;max-width:100%;aspect-ratio:16/11;object-fit:cover;object-position:center 30%;border-radius:24px;display:block}
/* trust */
.trust{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.trust .card{flex-direction:row;gap:14px;align-items:flex-start}
.ico{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--mist)}
.ico svg{width:22px;height:22px}
/* markets */
.mk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mk .card h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mk dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;margin:8px 0 0;font-size:15px}
.mk dt{color:var(--muted)} .mk dd{margin:0;font-family:var(--display);font-weight:600;text-align:end}
.src{font-size:12.5px;color:var(--muted);margin-top:14px}
/* pricing */
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plan.hl{border:2px solid var(--rose);position:relative}
.plan .price{font-family:var(--display);font-size:38px;font-weight:700;color:var(--accent);line-height:1.1}
.plan .price small{font-size:14px;color:var(--muted);font-weight:500}
.plan ul{margin:0;padding-inline-start:18px;font-size:14.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.badge{position:absolute;top:-13px;inset-inline-start:18px;background:var(--rose);color:#fff;font-family:var(--display);font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
/* faq */
details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
details+details{margin-top:10px}
summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:16px}
details p{margin-top:8px;color:var(--muted)}
/* final */
.final{background:linear-gradient(120deg,var(--lapis),#3B4F9A 55%,var(--rose));color:#fff;border-radius:32px;padding:48px 32px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.final h2{color:#fff}
footer{padding-block:32px 48px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:72px}
footer .wrap{display:flex;flex-direction:column;gap:8px}
@media (max-width:980px){.hero .wrap,.score .wrap,.assist .wrap,.family{grid-template-columns:1fr}.aud,.plans{grid-template-columns:repeat(2,minmax(0,1fr))}.links{display:none}.scorecard{inset-inline-start:8px}.askcard{inset-inline-end:8px}}
@media (max-width:620px){.steps,.aud,.plans,.trust,.mk{grid-template-columns:1fr}section{padding-block:52px}.part{grid-template-columns:minmax(0,1fr) 90px 44px}.askcard{max-width:200px;font-size:13px}.final{padding:36px 18px}}
</style>

  document.getElementById('trust').replaceChildren(...(ar?TRUST_AR:TRUST_EN).map(([ic,h,p])=>{ const c=el('div','card'); const i=el('div','ico'); i.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[ic]+'</svg>'; const d=el('div'); d.style.minWidth='0'; d.append(el('h3',null,h),el('p','muted',p)); c.append(i,d); return c; }));
  const mk = ar?MK_AR:MK_EN; ['jo','eg'].forEach(k=>{ document.getElementById(k==='jo'?'dlJo':'dlEg').replaceChildren(...mk[k].flatMap(([a,b])=>[el('dt',null,a),el('dd',null,b)])); });
  document.getElementById('plans').replaceChildren(...(ar?PLANS_AR:PLANS_EN).map(([n,p,per,li,badge])=>{ const c=el('div','plan'+(badge?' hl':'')); if(badge) c.append(el('span','badge',badge)); const pr=el('div','price',p); if(per) pr.append(el('small',null,' '+per)); const ul=el('ul'); li.forEach(x=>ul.append(el('li',null,x))); c.append(el('h3',null,n),pr,ul); return c; }));
  document.getElementById('faqList').replaceChildren(...FAQ[lang].map(([q,a])=>{ const d=el('details'); d.append(el('summary',null,q),el('p',null,a)); return d; }));
}
if(!T.jo.mkH){ T.jo.mkH='بنبدأ من الناس اللي بنفهمها أكثر'; T.eg.mkH='بنبدأ من الناس اللي فاهمينها أكتر'; }
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{ lang=b.dataset.lang; try{ localStorage.setItem('mirah.lang',lang); }catch(e){} render(); }));
render();
</script>
